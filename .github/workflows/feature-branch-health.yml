name: Feature branch health

# Long-lived feature branches (print-market may take years — founder 2026-10-15) must never
# quietly fall behind `main`. Every run: how far behind main the branch is and since when,
# whether main still merges in cleanly (and which files conflict if not), and the type check
# and tests ON THE MERGED TREE — so a green run means «this would still work if we merged today».
#
# Triggers: every push to a tracked branch, by hand (Actions → Run workflow), and weekly.
# NOTE: GitHub runs `schedule` only from the DEFAULT branch's copy of this file — the weekly
# check starts once this file is also on `main`. Builds nothing and publishes nothing.
#
# To track another branch, add it to the matrix below.

on:
  push:
    branches: [print-market]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        branch: [print-market]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || matrix.branch }}
          fetch-depth: 0

      - name: Drift from main
        run: |
          git config user.email "ci@drosspot.app"; git config user.name "Branch health"
          base=$(git merge-base HEAD origin/main)
          behind=$(git rev-list --count HEAD..origin/main)
          ahead=$(git rev-list --count origin/main..HEAD)
          days=$(( ( $(date +%s) - $(git log -1 --format=%ct "$base") ) / 86400 ))
          {
            echo "## ${{ matrix.branch }} ← main"
            echo "| behind main | ahead of main | main last merged in |"
            echo "|---|---|---|"
            echo "| **$behind** commits | $ahead commits | $days days ago ($(git log -1 --format=%cs "$base")) |"
          } >> "$GITHUB_STEP_SUMMARY"
          if git merge --no-commit --no-ff origin/main >/dev/null 2>&1; then
            echo "- ✅ main merges in cleanly — the checks below run on the merged tree." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- ❌ merging main conflicts in:" >> "$GITHUB_STEP_SUMMARY"
            git diff --name-only --diff-filter=U | sed 's/^/  - `/; s/$/`/' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx jest --ci
